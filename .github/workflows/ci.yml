name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alchemy_video_os
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: alchemy_video_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alchemy_video_os -d alchemy_video_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://alchemy_video_os:ci-only@127.0.0.1:5432/alchemy_video_os_test
      REDIS_URL: redis://127.0.0.1:6379/15
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: alchemy-video-os-ci
      S3_ACCESS_KEY: ci-minio-user
      S3_SECRET_KEY: ci-minio-password
      DOCUMENT_RUNTIME_PYTHON: ${{ github.workspace }}/services/document-runtime/.venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Start isolated MinIO
        shell: bash
        run: |
          docker run --detach --rm --name alchemy-video-os-ci-minio \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER=ci-minio-user \
            --env MINIO_ROOT_PASSWORD=ci-minio-password \
            --env MINIO_API_CORS_ALLOW_ORIGIN=http://127.0.0.1:3031 \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data --console-address :9001
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs alchemy-video-os-ci-minio
          exit 1
      - name: Install locked media runtime dependencies
        run: uv sync --project services/media-runtime --locked --no-dev
      - name: Install locked document runtime dependencies
        run: uv sync --project services/document-runtime --locked --no-dev
      - name: Create isolated MinIO test bucket
        run: pnpm --filter @alchemy-video/storage-client exec tsx tests/create-ci-bucket.ts
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrate isolated integration database
        run: pnpm --filter @alchemy-video/persistence db:migrate
      - name: Unit and contract tests
        run: pnpm test
      - name: Stop isolated MinIO
        if: always()
        run: docker rm --force alchemy-video-os-ci-minio || true

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high --json

  media-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEDIA_RUNTIME_FFMPEG_PATH: /usr/bin/ffmpeg
      MEDIA_RUNTIME_FFPROBE_PATH: /usr/bin/ffprobe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install FFmpeg for media integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install locked media runtime dependencies
        run: uv sync --project services/media-runtime --locked --no-dev
      - name: Python syntax check
        shell: bash
        run: python -m compileall -q services tools
      - name: Media runtime tests with installed FFmpeg
        working-directory: services/media-runtime
        run: uv run --project . --locked python -m unittest discover -s tests -p 'test_*.py' -v

  diff-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff hygiene
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          else
            git show --check --oneline HEAD
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
