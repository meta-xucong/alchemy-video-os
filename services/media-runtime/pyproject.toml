[project]
name = "alchemy-media-runtime"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "requests>=2.32,<3.0",
]

[project.optional-dependencies]
semantic = [
  "faster-whisper>=1.2,<2",
  "torch>=2.0,<3",
  "transformers>=4.40,<6",
]
audio = [
  "piper-tts>=1.7,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
