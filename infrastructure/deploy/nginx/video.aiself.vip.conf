map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name video.aiself.vip assets.video.aiself.vip;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name video.aiself.vip;

    ssl_certificate /etc/letsencrypt/live/video.aiself.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video.aiself.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 12m;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # The current Control API has only a dev identity. Keep the whole browser surface private
    # until the separate Veyra identity/session implementation is accepted.
    auth_basic "Private Video Verification";
    auth_basic_user_file /etc/nginx/secrets/video-users;

    location ^~ /provider-input/ {
        auth_basic off;
        access_log off;
        log_not_found off;
        error_log /dev/stderr crit;
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        proxy_pass http://control-api:8032;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ^~ /api/v1/events {
        proxy_pass http://control-api:8032;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location ^~ /api/v1/ {
        proxy_pass http://control-api:8032;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://studio-web:3031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name assets.video.aiself.vip;

    # The deployment issues one SAN certificate containing both public hosts.
    ssl_certificate /etc/letsencrypt/live/video.aiself.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video.aiself.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 12m;

    auth_basic off;
    access_log off;
    log_not_found off;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    add_header Access-Control-Allow-Origin "https://video.aiself.vip" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, PUT, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, If-None-Match" always;
    add_header Access-Control-Expose-Headers "ETag" always;
    add_header Vary "Origin" always;

    if ($request_method = OPTIONS) { return 204; }
    if ($request_method !~ ^(GET|HEAD|PUT)$) {
        return 405;
    }

    location ^~ /minio/ {
        return 404;
    }

    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
