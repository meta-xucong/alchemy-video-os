# Relay-only edge for local real-provider verification.
# This is intentionally separate from video.aiself.vip.conf (the future full-stack edge).
# The SSH reverse tunnel must expose the local Control API on 127.0.0.1:18080.

server {
    listen 80;
    listen [::]:80;
    server_name video.aiself.vip;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location ^~ /provider-input/ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}

